# AI 知识库前端站点：托管静态文件 + 反代后端接口
server {
    listen 80;
    server_name _;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # 接口：/api/* → server:3000/*（去掉 /api 前缀）
    location /api/ {
        # 前端文件夹上传按单文件发送，允许 20MB 文档上限及 multipart 开销
        client_max_body_size 25m;
        proxy_pass http://server:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 需要关闭缓冲，保证 token 实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 静态资源（头像等上传文件）：/uploads → server:3000/uploads
    location /uploads/ {
        proxy_pass http://server:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端单页应用：未匹配到的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
